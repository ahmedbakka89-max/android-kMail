name: Build Android APK

on:
  push:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check files
        run: |
          ls -la
          for f in capacitor.config.json www/index.html scripts/android-setup.mjs aman.keystore assets/icon-only.png; do
            test -f "$f" || { echo "MISSING FILE: $f"; exit 1; }
          done

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: |
          npm install @capacitor/core@7 @capacitor/android@7 @capacitor/cli@7
          npm install -D @capacitor/assets@3

      - name: Add Android platform
        run: npx cap add android

      - name: App icons
        run: npx @capacitor/assets generate --android --assetPath assets

      - name: Permissions and signing
        run: node scripts/android-setup.mjs

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Aman-APK
          path: android/app/build/outputs/apk/release/app-release.apk
